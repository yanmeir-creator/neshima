  <svg class="defs" width="0" height="0" aria-hidden="true"><defs>
    <!-- a slight wobble, so ruled lines and circles look drawn by hand -->
    <filter id="ink" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <!-- paper fibre and speckle -->
    <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .30  0 0 0 0 .20  0 0 0 0 .09  0 0 0 .55 -.14"/></filter>
    <pattern id="hatch" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="4.5" stroke="#e3d6b8" stroke-opacity="0.55" stroke-width="0.8"/></pattern>
  </defs></svg>
  <svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#paper)"/></svg>
